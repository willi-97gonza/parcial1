<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de productos</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="layout">

  <main class="card">
    <h1>Nuevo producto</h1>
    <p class="sub">Completa los datos para agregarlo al catálogo.</p>

    <form id="form" novalidate>
      <div class="field" id="f-nombre">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" maxlength="60" autocomplete="off" placeholder="Ej. Audífonos inalámbricos">
        <div class="msg" id="e-nombre" role="alert"></div>
      </div>

      <div class="row">
        <div class="field" id="f-precio">
          <label for="precio">Precio (USD)</label>
          <input id="precio" name="precio" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00">
          <div class="msg" id="e-precio" role="alert"></div>
        </div>

        <div class="field" id="f-categoria">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria">
            <option value="">Selecciona…</option>
            <option>Electrónica</option>
            <option>Hogar</option>
            <option>Ropa</option>
            <option>Alimentos</option>
            <option>Otros</option>
          </select>
          <div class="msg" id="e-categoria" role="alert"></div>
        </div>
      </div>

      <div class="field" id="f-descripcion">
        <label for="descripcion">Descripción <span class="hint" id="count">0/200</span></label>
        <textarea id="descripcion" name="descripcion" maxlength="200" placeholder="Cuenta brevemente de qué trata el producto"></textarea>
        <div class="msg" id="e-descripcion" role="alert"></div>
      </div>

      <button type="submit" class="btn-primary">Guardar producto</button>
      <div class="banner" id="banner" role="status"></div>
    </form>
  </main>

  <section class="card" aria-labelledby="lista-titulo">
    <div class="list-head">
      <h2 id="lista-titulo">Productos guardados <span class="badge" id="total">0</span></h2>
      <button type="button" class="btn-link" id="vaciar" hidden>Vaciar todo</button>
    </div>
    <ul class="lista" id="lista"></ul>
    <p class="vacio" id="vacio">Aún no hay productos. Los que agregues aparecerán aquí y se mantendrán al recargar la página.</p>
  </section>

</div>

<script>
const $ = id => document.getElementById(id);
const STORAGE_KEY = "catalogo.productos";

/* ---------- Almacenamiento en el navegador ---------- */
function cargar() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(data) ? data : [];
  } catch {
    return [];
  }
}

function persistir(lista) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
    return true;
  } catch {
    return false; // almacenamiento lleno o bloqueado por el navegador
  }
}

let productos = cargar();

/* ---------- Validación ---------- */
const rules = {
  nombre: v => !v.trim() ? "El nombre es obligatorio." : v.trim().length < 3 ? "Usa al menos 3 caracteres." : "",
  precio: v => v === "" ? "El precio es obligatorio." : Number(v) <= 0 ? "El precio debe ser mayor a 0." : "",
  categoria: v => !v ? "Elige una categoría." : "",
  descripcion: v => v.trim().length < 10 ? "Describe el producto en al menos 10 caracteres." : ""
};

function check(name) {
  const msg = rules[name]($(name).value);
  $("e-" + name).textContent = msg;
  $("f-" + name).classList.toggle("invalid", !!msg);
  return !msg;
}

Object.keys(rules).forEach(n => {
  $(n).addEventListener("blur", () => check(n));
  $(n).addEventListener("input", () => { if ($("f-" + n).classList.contains("invalid")) check(n); });
});
$("descripcion").addEventListener("input", e => $("count").textContent = e.target.value.length + "/200");

/* ---------- Lista de productos ---------- */
const moneda = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });

function render() {
  const ul = $("lista");
  ul.replaceChildren();

  productos.forEach(p => {
    const li = document.createElement("li");
    li.className = "item";

    const top = document.createElement("div");
    top.className = "item-top";

    const nombre = document.createElement("strong");
    nombre.textContent = p.nombre;

    const precio = document.createElement("span");
    precio.className = "precio";
    precio.textContent = moneda.format(Number(p.precio));

    top.append(nombre, precio);

    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = p.categoria;

    const desc = document.createElement("p");
    desc.className = "item-desc";
    desc.textContent = p.descripcion;

    const del = document.createElement("button");
    del.type = "button";
    del.className = "btn-link danger";
    del.textContent = "Eliminar";
    del.setAttribute("aria-label", "Eliminar " + p.nombre);
    del.addEventListener("click", () => {
      productos = productos.filter(x => x.id !== p.id);
      persistir(productos);
      render();
    });

    li.append(top, chip, desc, del);
    ul.append(li);
  });

  $("total").textContent = productos.length;
  $("vacio").hidden = productos.length > 0;
  $("vaciar").hidden = productos.length === 0;
}

$("vaciar").addEventListener("click", () => {
  if (confirm("¿Eliminar todos los productos guardados?")) {
    productos = [];
    persistir(productos);
    render();
  }
});

/* ---------- Envío del formulario ---------- */
let timerBanner;
function mostrarBanner(texto, tipo) {
  const banner = $("banner");
  banner.textContent = texto;
  banner.className = "banner " + tipo;
  clearTimeout(timerBanner);
  if (tipo === "ok") timerBanner = setTimeout(() => banner.className = "banner", 3500);
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const valido = Object.keys(rules).map(check).every(Boolean);
  if (!valido) return;

  const datos = Object.fromEntries(new FormData($("form")));
  const nuevo = {
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
    nombre: datos.nombre.trim(),
    precio: Number(datos.precio),
    categoria: datos.categoria,
    descripcion: datos.descripcion.trim(),
    creado: new Date().toISOString()
  };

  const anterior = productos;
  productos = [nuevo, ...productos]; // el más reciente primero

  if (persistir(productos)) {
    mostrarBanner("Producto guardado correctamente.", "ok");
    $("form").reset();
    $("count").textContent = "0/200";
    render();
  } else {
    productos = anterior;
    mostrarBanner("No se pudo guardar en el navegador. Revisa que el almacenamiento no esté bloqueado o lleno.", "error");
  }
});

render();
</script>
</body>
</html>
